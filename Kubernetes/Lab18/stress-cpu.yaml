# Test pod: loads every CPU core so usage goes above 80%
apiVersion: v1
kind: Pod
metadata:
  name: stress-cpu
  namespace: monitoring
spec:
  restartPolicy: Never
  tolerations:
    - operator: Exists
  containers:
    - name: stress
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - 'for i in $(seq 1 $(nproc)); do yes > /dev/null & done; wait'
