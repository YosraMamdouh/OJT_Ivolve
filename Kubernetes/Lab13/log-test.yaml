apiVersion: v1
kind: Pod
metadata:
  name: log-test
  namespace: ivolve
spec:
  tolerations:
    - key: workload
      operator: Equal
      value: ivolveApp
      effect: NoSchedule
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo 'hello from pod' >> /logs/app.log; sleep 3600"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      persistentVolumeClaim:
        claimName: ivolve-pvc
