# Used only to test the permissions of jenkins-sa (replicas 0: no Pods are created)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-test
  namespace: ivolve
spec:
  replicas: 0
  selector:
    matchLabels:
      app: rbac-test
  template:
    metadata:
      labels:
        app: rbac-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
